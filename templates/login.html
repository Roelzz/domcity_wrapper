<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Domcity Planner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.green.min.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <main class="container login-wrap">
    <article>
      <hgroup>
        <h1>🏛 Domcity Planner</h1>
        <p>Sign in to manage your gym schedule.</p>
      </hgroup>
      {% if error %}<p class="error">Wrong password.</p>{% endif %}
      <form method="post" action="/login">
        <label>
          Password
          <input type="password" name="password" autofocus required />
        </label>
        <button type="submit">Sign in</button>
      </form>
    </article>
  </main>
</body>
</html>
