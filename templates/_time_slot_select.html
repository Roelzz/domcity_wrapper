<select name="time_of_day" required id="time-slot-select"{% if not ready %} disabled{% endif %}>
  {% if not ready %}
    {% if selectors_complete %}
      <option value="" disabled selected>— no upcoming classes match —</option>
    {% else %}
      <option value="" disabled selected>— pick training &amp; day —</option>
    {% endif %}
  {% else %}
    {% if not selected %}<option value="" disabled selected>— select time &amp; location —</option>{% endif %}
    {% for loc, t in slots %}
      {% set v = loc ~ "|" ~ t %}
      <option value="{{ v }}" {% if v == selected %}selected{% endif %}>{{ t }} · {{ loc }}</option>
    {% endfor %}
  {% endif %}
</select>
