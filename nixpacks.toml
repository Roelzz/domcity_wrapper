# Coolify + Nixpacks build hints. Most of this is auto-detected from
# pyproject.toml + uv.lock — these phases just ensure UV is used.

[phases.setup]
nixPkgs = ["python312", "uv"]

[phases.install]
cmds = ["uv sync --frozen --no-dev"]

[start]
cmd = "uv run uvicorn main:app --host 0.0.0.0 --port ${PORT:-2009}"
